name: "Staging CI"

on:
  pull_request:
    branches: [release, dev]
    paths:
      - StagingArea/**
      - StagingAreaTests/**
      - PackageStagingArea.slnx
      - src/ValidationPackage.Model/**
      - src/ValidationPackage.Codecs/**
      - src/AVPR.Staging/**
      - build/**
      - build.cmd
      - build.sh
      - .config/dotnet-tools.json
      - package.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/staging-ci.yml
      - .github/workflows/run-build-target.yml
  push:
    branches: [release, dev]
    paths:
      - StagingArea/**
      - StagingAreaTests/**
      - PackageStagingArea.slnx
      - src/ValidationPackage.Model/**
      - src/ValidationPackage.Codecs/**
      - src/AVPR.Staging/**
      - build/**
      - build.cmd
      - build.sh
      - .config/dotnet-tools.json
      - package.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/staging-ci.yml
      - .github/workflows/run-build-target.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "Test staging area"
    uses: ./.github/workflows/run-build-target.yml
    with:
      target: TestStagingArea
      install-uv: true
      windows: true
      ubuntu: false
      macos: false
